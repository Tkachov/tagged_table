<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board – Tagged Table</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="board.css" />
  </head>
  <body>
    <nav class="menubar">
      <div class="menu" id="menuFile">
        <button class="menu__trigger" type="button">File</button>
        <div class="menu__dropdown">
          <button class="menu__item" id="menuExport" type="button">Save</button>
          <label class="menu__item" for="importFile">Load</label>
        </div>
      </div>
      <a href="index.html" class="menubar__link">← Table</a>
      <input id="importFile" type="file" accept="application/json,.json" hidden />
    </nav>

    <div class="board-controls">
      <label class="board-controls__label">
        Words per row:
        <input id="wordsPerRow" class="board-controls__input" type="number" value="40" min="1" max="500" />
      </label>
      <button id="startInteractiveBtn" class="btn">Interactive mode</button>
    </div>

    <div id="boardGrid" class="board-grid"></div>

    <!-- Interactive mode overlay -->
    <div id="interactiveOverlay" class="int-overlay" hidden>
      <button id="intClose" class="int-close" title="Close (discard current batch)">×</button>
      <div class="int-stage">
        <div id="intCards" class="int-cards"></div>
      </div>
      <div id="intNext" class="int-next" title="Next batch">
        <span class="int-next__arrow">›</span>
      </div>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="board.js"></script>
  </body>
</html>
